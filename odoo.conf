[options]
; Odoo 18 Community for Cortoba Supplies — runs as a Render Private Service.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
db_maxconn = 16

; The database manager and the database list are disabled: the service is
; private and only the RFQ api-server talks to it over the internal network.
; The database is created by the entrypoint on first run (ODOO_INIT_MODULES).
list_db = False

; Bind the HTTP server to port 10000. Render fixes a private service's internal
; port at 10000 (it is not configurable) and routes internal traffic there, so
; Odoo must listen on 10000. Do NOT bind this to Render's PORT variable:
; Odoo's stock entrypoint misreads PORT as the Postgres port.
http_port = 10000
http_interface = 0.0.0.0
